apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opshub.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opshub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.mysql.enabled }}
  mysql-root-password: {{ .Values.mysql.auth.rootPassword | quote }}
  mysql-password: {{ .Values.mysql.auth.rootPassword | quote }}
  {{- else }}
  mysql-password: {{ .Values.externalDatabase.password | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  redis-password: {{ .Values.redis.auth.password | quote }}
  {{- else }}
  redis-password: {{ .Values.externalRedis.password | quote }}
  {{- end }}
  jwt-secret: {{ .Values.server.jwtSecret | quote }}
  logcenter-encryption-key: {{ .Values.logCenter.encryptionKey | quote }}
  logcenter-decryption-keys: {{ .Values.logCenter.decryptionKeys | quote }}
  log-ingest-token: {{ .Values.logCenter.ingest.ingestToken | quote }}
  log-ingest-tokens: {{ join "," (concat (list .Values.logCenter.ingest.ingestToken) .Values.logCenter.ingest.ingestPreviousTokens) | quote }}
  log-writer-token: {{ .Values.logCenter.ingest.writerToken | quote }}
  log-kafka-password: {{ .Values.logCenter.ingest.queue.sasl.password | quote }}
  {{- if .Values.clickhouse.enabled }}
  clickhouse-password: {{ .Values.clickhouse.auth.password | quote }}
  {{- else }}
  clickhouse-password: {{ .Values.externalClickHouse.password | quote }}
  {{- end }}
