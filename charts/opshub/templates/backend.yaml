{{- if and (gt (int .Values.backend.replicaCount) 1) (not .Values.logCenter.export.persistence.enabled) }}
{{- fail "backend.replicaCount 大于 1 时必须启用 logCenter.export.persistence，共享日志导出文件" }}
{{- end }}
{{- if and (gt (int .Values.backend.replicaCount) 1) (not (has "ReadWriteMany" .Values.logCenter.export.persistence.accessModes)) }}
{{- fail "backend.replicaCount 大于 1 时 logCenter.export.persistence.accessModes 必须包含 ReadWriteMany" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opshub.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opshub.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  revisionHistoryLimit: {{ .Values.backend.revisionHistoryLimit | default 10 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "opshub.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opshub.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # 等待 MySQL 就绪
        - name: wait-for-mysql
          image: "{{ .Values.global.busybox.repository }}:{{ .Values.global.busybox.tag }}"
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "opshub.mysql.host" . }} {{ include "opshub.mysql.port" . }}; do
                echo "Waiting for MySQL..."
                sleep 2
              done
              echo "MySQL is ready!"
        # 等待 Redis 就绪
        - name: wait-for-redis
          image: "{{ .Values.global.busybox.repository }}:{{ .Values.global.busybox.tag }}"
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "opshub.redis.host" . }} {{ include "opshub.redis.port" . }}; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready!"
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.httpPort }}
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.server.timezone | quote }}
            - name: OPSHUB_SERVER_MODE
              value: {{ .Values.server.mode | quote }}
            - name: OPSHUB_SERVER_TIMEZONE
              value: {{ .Values.server.timezone | quote }}
            - name: OPSHUB_SERVER_HTTP_PORT
              value: {{ .Values.server.httpPort | quote }}
            - name: OPSHUB_SERVER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "opshub.fullname" . }}-secrets
                  key: jwt-secret
            - name: OPSHUB_SERVER_JWT_EXPIRE
              value: {{ .Values.server.jwtExpire | quote }}
            - name: OPSHUB_SERVER_EXTERNAL_URL
              value: {{ include "opshub.server.externalURL" . | quote }}
            - name: OPSHUB_SERVER_FRONTEND_URL
              value: {{ include "opshub.frontend.url" . | quote }}
            - name: OPSHUB_DATABASE_HOST
              value: {{ include "opshub.mysql.host" . | quote }}
            - name: OPSHUB_DATABASE_PORT
              value: {{ include "opshub.mysql.port" . | quote }}
            - name: OPSHUB_DATABASE_DATABASE
              value: {{ include "opshub.mysql.database" . | quote }}
            - name: OPSHUB_DATABASE_USERNAME
              {{- if .Values.mysql.enabled }}
              value: "root"
              {{- else }}
              value: {{ .Values.externalDatabase.username | quote }}
              {{- end }}
            - name: OPSHUB_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opshub.fullname" . }}-secrets
                  key: mysql-password
            - name: OPSHUB_REDIS_HOST
              value: {{ include "opshub.redis.host" . | quote }}
            - name: OPSHUB_REDIS_PORT
              value: {{ include "opshub.redis.port" . | quote }}
            - name: OPSHUB_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opshub.fullname" . }}-secrets
                  key: redis-password
            - name: OPSHUB_REDIS_DB
              {{- if .Values.redis.enabled }}
              value: "0"
              {{- else }}
              value: {{ .Values.externalRedis.db | quote }}
              {{- end }}
            - name: OPSHUB_LOGCENTER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "opshub.fullname" . }}-secrets
                  key: logcenter-encryption-key
            - name: OPSHUB_LOGCENTER_DECRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "opshub.fullname" . }}-secrets
                  key: logcenter-decryption-keys
            - name: OPSHUB_LOGCENTER_CLICKHOUSE_ENDPOINT
              value: {{ include "opshub.clickhouse.endpoint" . | quote }}
            - name: OPSHUB_LOGCENTER_CLICKHOUSE_CLUSTER
              value: {{ include "opshub.clickhouse.clusterName" . | quote }}
            - name: OPSHUB_LOGCENTER_CLICKHOUSE_DATABASE
              value: {{ include "opshub.clickhouse.database" . | quote }}
            - name: OPSHUB_LOGCENTER_CLICKHOUSE_USERNAME
              value: {{ include "opshub.clickhouse.username" . | quote }}
            - name: OPSHUB_LOGCENTER_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opshub.fullname" . }}-secrets
                  key: clickhouse-password
            {{- if .Values.logCenter.ingest.enabled }}
            - name: OPSHUB_LOG_GATEWAY_STATUS_URL
              value: {{ printf "http://%s-log-gateway:%v" (include "opshub.fullname" .) .Values.logCenter.ingest.gateway.service.port | quote }}
            - name: OPSHUB_LOG_WRITER_STATUS_URL
              value: {{ printf "http://%s-log-writer:%v" (include "opshub.fullname" .) .Values.logCenter.ingest.writer.servicePort | quote }}
            - name: OPSHUB_LOG_QUEUE_MODE
              value: {{ .Values.logCenter.ingest.queue.mode | lower | quote }}
            - name: OPSHUB_LOG_INGEST_TEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "opshub.fullname" . }}-secrets
                  key: log-ingest-token
            - name: OPSHUB_LOG_AGENT_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "opshub.fullname" . }}-secrets
                  key: log-ingest-token
            - name: OPSHUB_LOG_GATEWAY_PUBLIC_URL
              value: {{ .Values.logCenter.ingest.gateway.publicURL | default (include "opshub.frontend.url" .) | quote }}
            - name: OPSHUB_LOG_AGENT_IMAGE
              value: {{ .Values.logCenter.kubernetesCollector.image | quote }}
            {{- end }}
            - name: OPSHUB_LOG_TAIL_MAX_CONNECTIONS
              value: {{ .Values.logCenter.tail.maxConnections | quote }}
            - name: OPSHUB_LOG_TAIL_POLL_MILLISECONDS
              value: {{ .Values.logCenter.tail.pollMilliseconds | quote }}
            - name: OPSHUB_LOG_TAIL_MAX_MINUTES
              value: {{ .Values.logCenter.tail.maxMinutes | quote }}
            - name: OPSHUB_LOG_TAIL_REAUTH_SECONDS
              value: {{ .Values.logCenter.tail.reauthorizeSeconds | quote }}
            - name: OPSHUB_LOG_TTL_MERGE_TIMEOUT_SECONDS
              value: {{ .Values.logCenter.retention.ttlMergeTimeoutSeconds | quote }}
            - name: OPSHUB_LOG_EXPORT_DIR
              value: "/app/data/log-exports"
            - name: OPSHUB_LOG_EXPORT_MAX_ROWS
              value: {{ .Values.logCenter.export.maxRows | quote }}
            - name: OPSHUB_LOG_EXPORT_WORKERS
              value: {{ .Values.logCenter.export.workers | quote }}
            - name: OPSHUB_LOG_EXPORT_QUEUE_CAPACITY
              value: {{ .Values.logCenter.export.queueCapacity | quote }}
            - name: OPSHUB_LOG_EXPORT_MAX_ATTEMPTS
              value: {{ .Values.logCenter.export.maxAttempts | quote }}
            - name: OPSHUB_LOG_EXPORT_LEASE_SECONDS
              value: {{ .Values.logCenter.export.leaseSeconds | quote }}
            - name: OPSHUB_LOG_EXPORT_RETENTION_HOURS
              value: {{ .Values.logCenter.export.retentionHours | quote }}
            - name: OPSHUB_LOG_EXPORT_TIMEOUT_MINUTES
              value: {{ .Values.logCenter.export.timeoutMinutes | quote }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: log-exports
              mountPath: /app/data/log-exports
          {{- if .Values.backend.terminalRecordings.persistence.enabled }}
            - name: terminal-recordings
              mountPath: /app/data/terminal-recordings
          {{- end }}
          {{- if .Values.backend.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.livenessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.backend.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
          {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: log-exports
          {{- if .Values.logCenter.export.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "opshub.fullname" . }}-log-exports
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- if .Values.backend.terminalRecordings.persistence.enabled }}
        - name: terminal-recordings
          persistentVolumeClaim:
            claimName: {{ include "opshub.fullname" . }}-terminal-recordings
      {{- end }}
{{- if and .Values.backend.podDisruptionBudget.enabled (gt (int .Values.backend.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "opshub.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opshub.backend.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.backend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "opshub.backend.selectorLabels" . | nindent 6 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opshub.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opshub.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "opshub.backend.selectorLabels" . | nindent 4 }}
