# OpsHub Helm Chart 配置文件
# 详细配置说明请参考 README.md

# ==================== 全局配置 ====================
global:
  # 存储类（留空使用默认）
  storageClass: ""
  # 镜像拉取策略
  imagePullPolicy: IfNotPresent
  # 镜像拉取密钥
  imagePullSecrets: []
  # busybox 镜像（用于 initContainer 等待依赖服务）
  busybox:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/busybox
    tag: "1.37.0"

# ==================== 后端配置 ====================
backend:
  # 默认单副本可直接使用本地导出目录。扩为多副本时必须同时启用
  # logCenter.export.persistence，并使用支持 ReadWriteMany 的存储类。
  replicaCount: 1
  revisionHistoryLimit: 10

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  image:
    repository: docker.1ms.run/dyclouds/opshub-api
    tag: v0.0.9
    pullPolicy: Always

  # 服务配置
  service:
    type: ClusterIP
    port: 9876

  # 资源限制
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # 终端录像存储配置（多副本部署时必须启用共享存储）
  # 需要支持 ReadWriteMany (RWX) 的存储类，如 NFS、CephFS、云厂商共享文件存储
  terminalRecordings:
    # 是否启用持久化存储（多副本部署时建议启用）
    persistence:
      enabled: false
      # 存储类（需支持 RWX 访问模式）
      # 示例: nfs-client, cephfs, alicloud-nas, tencentcloud-cfs
      storageClass: ""
      # 存储大小
      size: 10Gi
      # 访问模式（多副本必须使用 ReadWriteMany）
      accessModes:
        - ReadWriteMany

  # 健康检查
  livenessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5

  readinessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3

  # 节点选择器
  nodeSelector: {}

  # 容忍度
  tolerations: []

  # 亲和性
  affinity: {}

# ==================== 前端配置 ====================
frontend:
  # 副本数
  replicaCount: 2
  revisionHistoryLimit: 10

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  image:
    repository: docker.1ms.run/dyclouds/opshub-web
    tag: v0.0.9
    pullPolicy: Always

  # 服务配置
  service:
    type: ClusterIP
    port: 80

  # 资源限制
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

  # 健康检查
  livenessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10

  readinessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5

  # 节点选择器
  nodeSelector: {}

  # 容忍度
  tolerations: []

  # 亲和性
  affinity: {}

# ==================== MySQL 配置 ====================
mysql:
  # 是否启用内置 MySQL（设为 false 使用外部数据库）
  enabled: true

  image:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql
    tag: "8.0.44"
    pullPolicy: IfNotPresent

  # 认证配置
  auth:
    rootPassword: "OpsHub@2026"
    database: opshub

  # 持久化存储
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  # 资源限制
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  # 节点选择器
  nodeSelector: {}

  # 容忍度
  tolerations: []

# ==================== Redis 配置 ====================
redis:
  # 是否启用内置 Redis（设为 false 使用外部 Redis）
  enabled: true

  image:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  # 认证配置
  auth:
    password: "OpsHub@Redis"

  # 持久化存储
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""

  # 资源限制
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  # 节点选择器
  nodeSelector: {}

  # 容忍度
  tolerations: []

# ==================== 外部数据库配置 ====================
# 当 mysql.enabled=false 时使用
externalDatabase:
  host: ""
  port: 3306
  database: opshub
  username: root
  password: ""

# ==================== 外部 Redis 配置 ====================
# 当 redis.enabled=false 时使用
externalRedis:
  host: ""
  port: 6379
  password: ""
  db: 0

# ==================== ClickHouse 日志存储 ====================
clickhouse:
  # 是否部署 OpsHub 内置 ClickHouse；设为 false 后可在日志库页面配置外部 ClickHouse
  enabled: true
  image:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/clickhouse/clickhouse-server
    tag: "24.8"
    pullPolicy: IfNotPresent
  auth:
    username: opshub
    password: "OpsHub@ClickHouse"
    database: opshub_logs
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  nodeSelector: {}
  tolerations: []
  highAvailability:
    # 新建生产环境可开启。现有单节点实例切换前必须先迁移数据，不能直接复用旧 PVC。
    enabled: false
    clusterName: opshub_logs_cluster
    replicaCount: 2
    # hard 要求副本分布在不同 Kubernetes 节点；节点不足时可临时改为 soft。
    antiAffinity: hard
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    keeper:
      replicaCount: 3
      antiAffinity: hard
      persistence:
        enabled: true
        size: 10Gi
        storageClass: ""
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "1Gi"
          cpu: "1000m"
      podDisruptionBudget:
        enabled: true
        minAvailable: 2

externalClickHouse:
  endpoint: ""
  username: default
  password: ""
  database: opshub_logs

logCenter:
  # 用于加密 ClickHouse 等日志中心凭据，生产环境必须修改
  encryptionKey: "opshub-logcenter-encryption-key-change-in-production"
  # 轮换 encryptionKey 时临时填写旧密钥，启动后凭据会自动使用当前密钥重加密。
  # 确认所有副本升级并验证后应清空此项。
  decryptionKeys: ""
  ingest:
    enabled: true
    highAvailability:
      # 开启后会校验 Gateway/Writer、Kafka/Redpanda 和 ClickHouse 是否满足生产最小拓扑。
      enabled: false
    ingestToken: "opshub-log-ingest-token-change-in-production"
    # Token 轮换期间保留旧 Token；所有 Agent 更新后应清空。
    ingestPreviousTokens: []
    writerToken: "opshub-log-writer-token-change-in-production"
    queue:
      # direct 适合演示/小规模；生产环境使用 kafka
      mode: direct
      # 使用外部 Kafka 时填写多个 bootstrap 地址；内置 Redpanda 启用时可留空
      brokers: []
      topic: opshub.logs.v1
      deadletterTopic: opshub.logs.deadletter.v1
      consumerGroup: opshub-log-writer
      partitions: 12
      replicationFactor: 1
      autoCreateTopics: true
      retentionHours: 72
      maxPollRecords: 500
      fetchMaxMB: 64
      tls:
        enabled: false
        skipVerify: false
      sasl:
        mechanism: ""
        username: ""
        password: ""
      redpanda:
        enabled: false
        replicaCount: 1
        antiAffinity: soft
        image:
          repository: docker.1ms.run/redpandadata/redpanda
          tag: v24.3.18
          pullPolicy: IfNotPresent
        smp: 1
        memory: 1G
        persistence:
          enabled: true
          size: 20Gi
          storageClass: ""
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
    gateway:
      replicaCount: 2
      image:
        repository: docker.1ms.run/dyclouds/opshub-log-gateway
        tag: v0.0.9
        pullPolicy: Always
      # Agent 可访问地址；留空时自动使用 server.frontendURL 或 Ingress 域名
      publicURL: ""
      service:
        type: ClusterIP
        port: 9880
        grpcPort: 9882
      ratePerSecond: 5000
      burstRecords: 10000
      globalRatePerSecond: 50000
      globalBurstRecords: 100000
      maxInflight: 256
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"
    writer:
      replicaCount: 2
      image:
        repository: docker.1ms.run/dyclouds/opshub-log-writer
        tag: v0.0.9
        pullPolicy: Always
      servicePort: 9881
      queueCapacity: 2048
      workers: 4
      maxRetries: 3
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      deadletter:
        persistence:
          enabled: false
          size: 5Gi
          storageClass: ""
          accessModes:
            - ReadWriteMany
      resources:
        requests:
          memory: "256Mi"
          cpu: "200m"
        limits:
          memory: "1Gi"
          cpu: "1000m"
  kubernetesCollector:
    # Kubernetes 节点日志采集器使用独立镜像，版本应与当前控制面兼容
    image: docker.1ms.run/dyclouds/opshub-log-agent:v0.0.9
  tail:
    maxConnections: 50
    pollMilliseconds: 1000
    maxMinutes: 60
    # 长连接周期性重验用户与日志访问策略，程序会限制在 5-300 秒
    reauthorizeSeconds: 15
  retention:
    # ClickHouse 检查并执行 TTL 清理的调度周期，生产建议 1 小时
    ttlMergeTimeoutSeconds: 3600
  export:
    maxRows: 1000000
    workers: 2
    queueCapacity: 100
    maxAttempts: 3
    leaseSeconds: 300
    retentionHours: 24
    timeoutMinutes: 120
    persistence:
      # 后端多副本时必须启用，并使用支持 ReadWriteMany 的存储类
      enabled: false
      size: 20Gi
      storageClass: ""
      accessModes:
        - ReadWriteMany

# ==================== 服务器配置 ====================
server:
  # 运行模式: debug / release
  mode: release
  # 容器时区，需与数据库时间保持一致
  timezone: Asia/Shanghai
  # HTTP 端口
  httpPort: 9876
  # JWT 密钥（生产环境请修改为随机字符串）
  jwtSecret: "opshub-jwt-secret-key-please-change-in-production"
  # JWT 过期时间
  jwtExpire: "24h"
  # 外部访问URL（用于OAuth2 SSO，如 http://opshub.example.com:9876）
  externalURL: ""
  # 前端访问URL（用于告警通知、OAuth2 登录回跳等前端页面链接，如 http://opshub.example.com）
  frontendURL: ""

# ==================== Ingress 配置 ====================
ingress:
  # 是否启用 Ingress
  enabled: false
  # Ingress 类名
  className: nginx
  # 注解
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # WebSocket 支持
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
  # 主机配置
  hosts:
    - host: opshub.example.com
      paths:
        - path: /
          pathType: Prefix
  # TLS 配置
  tls: []
  # - secretName: opshub-tls
  #   hosts:
  #     - opshub.example.com

# ==================== ServiceMonitor 配置 ====================
# Prometheus Operator 监控
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  namespace: ""

# ==================== Pod 中断预算 ====================
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# ==================== 水平自动扩缩 ====================
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
